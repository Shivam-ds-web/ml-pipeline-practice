stages:
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps: 
    - src/data_ingestion.py
    outs:
    - data/raw
  data_preprocessing:
    cmd: python src/data_preprocessing.py
    deps:
    - data/raw
    - src/data_preprocessing.py
    outs:
    - data/interim
  feature_engineering:
    cmd: python src/featire_engineering.py
    deps:
    - data/interim
    - src/featire_engineering.py
    outs:
    - data/engineered
  model_building:
    cmd: python src/model_building.py
    deps:
    - data/engineered
    - src/model_building.py
    outs:
    - models/model.pkl
  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
    - data/engineered
    - models/model.pkl
    - src/model_evaluation.py
    outs:
    - reports/metrics.json
  